    # ---- 별점 (회원별 평점 집계, US-015 [v2.3.0]) ----
    RecipeRating:
      type: object
      description: |
        [US-015] 레시피의 회원별 평점 집계. 소유자 단일값이 아니라 여러 회원 평점의 집계다.
        평가가 0건이면 average=null, count=0.
      required: [average, count]
      properties:
        average:
          type: number
          format: float
          nullable: true
          minimum: 1
          maximum: 5
          description: 평균 평점(1~5). 평가 0건이면 null(계산에서 제외).
          example: 4.5
        count:
          type: integer
          minimum: 0
          description: 평가한 회원 수(평가 수).
          example: 12
      example:
        average: 4.5
        count: 12

    RatingWriteRequest:
      type: object
      description: '[US-015] 별점 등록/수정 본문. 1인 1평점 upsert.'
      required: [score]
      properties:
        score:
          type: integer
          minimum: 1
          maximum: 5
          description: 평점 (1~5 정수). 범위 밖이면 400.
          example: 5
      example:
        score: 5

    RatingResponse:
      type: object
      description: |
        [US-015] 별점 등록/수정/취소 후 갱신된 레시피 평점 집계와 내 평점.
        DELETE(취소) 응답에서는 my_score 가 null.
      required: [recipe_id, rating]
      properties:
        recipe_id:
          type: string
          example: rcp_01HZX2KpQ
        rating:
          $ref: '#/components/schemas/RecipeRating'
        my_score:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5
          description: 현재 회원의 평점. 취소(DELETE) 후에는 null.
          example: 5
      example:
        recipe_id: rcp_01HZX2KpQ
        rating: { average: 4.6, count: 13 }
        my_score: 5

    # ---- 홈 대시보드 (US-018 [v2.3.0]) ----
    DashboardSummary:
      type: object
      description: |
        [US-018] 홈 대시보드 요약. KPI 4종 + 패널 3종. 로그인 회원 개인 데이터 기반.
        makeable_* 판정은 매칭률 100%(v1 US-012 규칙 승계, 유통기한·보관위치 미반영).
      required:
        - registered_recipe_count
        - makeable_recipe_count
        - inventory_ingredient_count
        - expiring_soon_count
        - makeable_recipes
        - expiring_ingredients
        - recent_recipes
      properties:
        registered_recipe_count:
          type: integer
          minimum: 0
          description: 'KPI① 등록 레시피 수.'
          example: 12
        makeable_recipe_count:
          type: integer
          minimum: 0
          description: 'KPI② 지금 만들 수 있는(매칭률 100%) 레시피 수.'
          example: 3
        inventory_ingredient_count:
          type: integer
          minimum: 0
          description: 'KPI③ 내 재고 종수(활성 재고 항목 수).'
          example: 8
        expiring_soon_count:
          type: integer
          minimum: 0
          description: 'KPI④ 임박 재료(D-3, 유통기한 D-day ≤ 3) 종수.'
          example: 2
        category_distribution:
          type: array
          description: '(선택) KPI① 부가 정보 — 등록 레시피의 카테고리 분포.'
          items:
            type: object
            required: [category, count]
            properties:
              category:
                type: string
                nullable: true
                description: 카테고리명. 미분류는 null.
                example: 한식
              count:
                type: integer
                example: 5
          example:
            - { category: 한식, count: 5 }
            - { category: 양식, count: 4 }
            - { category: null, count: 3 }
        makeable_recipes:
          type: array
          description: '패널① 지금 만들 수 있는 레시피(매칭률 100%). RecipeListItem 재사용.'
          items:
            $ref: '#/components/schemas/RecipeListItem'
        expiring_ingredients:
          type: array
          description: '패널② 유통기한 임박(D-3) 재고. InventoryItem 재사용(expires_at 포함).'
          items:
            $ref: '#/components/schemas/InventoryItem'
        recent_recipes:
          type: array
          description: '패널③ 최근 추가한 레시피(최신순). RecipeListItem 재사용.'
          items:
            $ref: '#/components/schemas/RecipeListItem'
      example:
        registered_recipe_count: 12
        makeable_recipe_count: 3
        inventory_ingredient_count: 8
        expiring_soon_count: 2
        category_distribution:
          - { category: 한식, count: 5 }
          - { category: 양식, count: 4 }
          - { category: null, count: 3 }
        makeable_recipes:
          - id: rcp_01HZX2KpQ
            title: 김치찌개
            category: 한식
            photo_url: https://cdn.example.com/u/rcp_01HZX2KpQ.jpg
            ingredient_count: 5
            missing_count: 0
            cook_time_minutes: 15
            rating: { average: 4.5, count: 12 }
            owner_id: usr_01HZX2Kme
            created_at: '2026-07-24T10:00:00Z'
            updated_at: '2026-07-24T10:00:00Z'
        expiring_ingredients:
