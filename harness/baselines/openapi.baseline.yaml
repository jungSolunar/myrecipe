# =============================================================================
# api/openapi.yaml — 레시피 & 식재료 관리 웹서비스 API 계약 (Contract-First)
#
# CHANGELOG
#   v1.0.0 (2026-07-24, backend-dev, G2)
#     - 최초 계약 확정. PRD Must 유저스토리 US-001~US-010 전 커버.
#     - 인증(세션 쿠키), 레시피 CRUD/목록/상세/검색·필터, 식재료 개인별 마스터 CRUD,
#       레시피-식재료 연결(요청 본문 임베드) 정의.
#     - Should(US-011 재고 / US-012 부족 재료)·Could(US-013 추천)는 확장 여지로
#       엔드포인트/스키마를 포함하되 "필수 계약 대상 아님(x-story-priority)"으로 표기.
#
# 규칙(api-conventions 스킬 준수):
#   - URL: /api/v1/, 복수 명사 리소스, 동사 금지
#   - 에러 포맷: { "error": { code, message, details:[{field,reason}] } }
#   - 페이지네이션: 커서 기반 ?cursor=&limit=, 응답 { data, next_cursor, has_more }
#   - 모든 스키마에 example 포함 (FE mock 서버 사용)
#   - 하위 호환 깨는 변경은 새 버전 경로(/api/v2)로
# =============================================================================
openapi: 3.0.3

info:
  title: 레시피 & 식재료 관리 API
  version: 1.0.0
  description: |
    개인 회원이 자신의 레시피와 식재료를 등록·검색·관리하는 웹서비스 API.

    ## 권한 모델 (PRD US-003, Q4-c)
    - **열람 자유(비로그인 허용)**: 레시피 목록 조회, 레시피 상세 조회
    - **로그인 필요(등록·수정·삭제)**: 레시피 생성/수정/삭제, 식재료 마스터 CRUD,
      재고 관리, `me` 조회 등 개인 데이터 접근
    - 비로그인 상태로 쓰기 시도 시 `401 AUTH_REQUIRED` 를 반환하고,
      FE는 이를 로그인 유도 화면으로 처리한다.

    ## 소유권 (US-006, US-007)
    - 레시피/식재료/재고는 **소유 회원만** 수정·삭제 가능.
      타인 리소스 쓰기 시도 시 `403 FORBIDDEN`.

    ## 식재료 마스터 (확정: 회원 개인별)
    - 식재료 마스터는 전 회원 공용이 아니라 **회원 개인별** 목록이다.
      따라서 목록 조회부터 로그인이 필요하다.

servers:
  - url: /api/v1
    description: v1 (경로 버저닝)

tags:
  - name: auth
    description: 인증 (회원가입/로그인/로그아웃) — US-001~003
  - name: recipes
    description: 레시피 CRUD·목록·상세·검색 — US-004~007, US-010
  - name: ingredients
    description: 식재료 개인 마스터 CRUD — US-008 (레시피 연결은 US-009)
  - name: inventory
    description: 보유 재고 관리 — US-011 [Should, 확장]
  - name: uploads
    description: 사진 업로드 — US-004 사진(선택) 지원

# 기본적으로 세션 쿠키 인증을 요구한다. 공개(열람 자유) 엔드포인트는 개별적으로 security:[] 로 해제한다.
security:
  - cookieAuth: []

paths:
  # ===========================================================================
  # 인증 — US-001, US-002, US-003
  # ===========================================================================
  /auth/signup:
    post:
      tags: [auth]
      summary: 회원가입 (US-001)
      description: 이메일/비밀번호로 계정을 생성하고 즉시 로그인 상태(세션 쿠키 발급)가 된다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: 생성됨. 세션 쿠키가 Set-Cookie 로 발급된다.
          headers:
            Set-Cookie:
              schema:
                type: string
              example: session=eyJhbGci...; HttpOnly; Secure; SameSite=Lax; Path=/
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: 이메일 중복 (EMAIL_ALREADY_EXISTS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: EMAIL_ALREADY_EXISTS
                  message: 이미 가입된 이메일입니다.
                  details: [{ field: email, reason: duplicate }]

  /auth/login:
    post:
      tags: [auth]
      summary: 로그인 (US-002)
      description: 자격증명 검증 후 세션 쿠키를 발급한다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 인증 성공. 세션 쿠키 발급.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: 자격증명 불일치 (INVALID_CREDENTIALS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: 이메일 또는 비밀번호가 올바르지 않습니다.
                  details: []

  /auth/logout:
    post:
      tags: [auth]
      summary: 로그아웃 (US-002)
      description: 세션을 종료하고 열람 전용 상태로 돌아간다. 세션 쿠키를 만료시킨다.
      responses:
        '204':
          description: 로그아웃 완료 (본문 없음). 세션 쿠키 만료.
        '401':
          $ref: '#/components/responses/AuthRequired'

  /auth/me:
    get:
      tags: [auth]
      summary: 현재 로그인 사용자 조회 (US-003 게이트 판별용)
      description: FE가 로그인 상태/사용자 정보를 확인해 등록·수정 UI를 게이팅하는 데 사용한다.
      responses:
        '200':
          description: 현재 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/AuthRequired'

  # ===========================================================================
  # 레시피 — US-004~007, US-010
  # ===========================================================================
  /recipes:
    get:
      tags: [recipes]
      summary: 레시피 목록·검색·필터 (US-005 목록, US-010 검색/필터)
      description: |
        비로그인 열람 가능(US-003). 커서 기반 페이지네이션.
        - `q`: 이름 키워드 검색 (US-010)
        - `category`: 카테고리 필터 (US-010)
        - `ingredient_id`: 재료 필터. 반복 지정 시 지정한 재료를 모두 포함하는 레시피 (US-010)
        - `available_only`: 내 재고로 모든 재료 충족 가능한 레시피만 (US-013 [Could], 로그인 필요)
        - `sort`: 정렬. `recent`(기본) | `missing_asc`(부족 재료 적은 순, US-013 [Could])
        결과 없음 시 200 + 빈 data (US-010 빈 결과 안내).
      security: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          required: false
          description: 레시피 이름 키워드
          schema:
            type: string
            example: 김치찌개
        - name: category
          in: query
          required: false
          schema:
            type: string
            example: 한식
        - name: ingredient_id
          in: query
          required: false
          description: 재료 ID 필터 (반복 가능, AND 조건)
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          example: ["ing_01HZX2K", "ing_01HZX9Q"]
        - name: available_only
          in: query
          required: false
          description: '[Could/US-013] 내 재고로 만들 수 있는 레시피만. 로그인 필요.'
          schema:
            type: boolean
            default: false
            example: false
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [recent, missing_asc]
            default: recent
            example: recent
      responses:
        '200':
          description: 레시피 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeListResponse'
    post:
      tags: [recipes]
      summary: 레시피 등록 (US-004)
      description: |
        로그인 필요. 제목이 필수이며 조리 단계·카테고리·사진(선택)·재료 연결을 함께 저장한다.
        재료는 식재료 마스터의 `ingredient_id` 로 연결한다(US-009). 마스터에 없는 재료는
        먼저 `POST /ingredients` 로 등록한 뒤 연결한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeWriteRequest'
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeDetail'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthRequired'

  /recipes/{recipeId}:
    parameters:
      - $ref: '#/components/parameters/RecipeId'
    get:
      tags: [recipes]
      summary: 레시피 상세 조회 (US-005)
      description: |
        비로그인 열람 가능(US-003). 제목·재료·조리 단계·사진·카테고리를 반환한다.
        로그인 상태이고 재고 데이터가 있으면 `ingredient_availability` 로 부족 재료를
        함께 반환한다(US-012 [Should]). 비로그인 시 해당 필드는 생략된다.
      security: []
      responses:
        '200':
          description: 레시피 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [recipes]
      summary: 레시피 수정 (US-006)
      description: 로그인 필요. 소유자만 수정 가능(타인 레시피 수정 시 403). 전체 필드를 교체한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeWriteRequest'
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeDetail'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [recipes]
      summary: 레시피 삭제 (US-007)
      description: 로그인 필요. 소유자만 삭제 가능(타인 레시피 삭제 시 403). soft delete.
      responses:
        '204':
          description: 삭제됨 (본문 없음)
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===========================================================================
  # 식재료 개인 마스터 — US-008 (연결은 US-009, 레시피 요청 본문에서 처리)
  # ===========================================================================
  /ingredients:
    get:
      tags: [ingredients]
      summary: 내 식재료 마스터 목록 (US-008)
      description: 회원 개인별 마스터이므로 로그인 필요. `q` 로 이름 검색(레시피 편집 시 재료 검색, US-009).
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          required: false
          description: 재료명 검색 키워드
          schema:
            type: string
            example: 양파
        - name: category
          in: query
          required: false
          schema:
            type: string
            example: 채소
      responses:
        '200':
          description: 식재료 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngredientListResponse'
        '401':
          $ref: '#/components/responses/AuthRequired'
    post:
      tags: [ingredients]
      summary: 식재료 마스터 등록 (US-008)
      description: 로그인 필요. 이름·분류·기본 단위 저장. 동일 이름(내 마스터 기준) 중복 시 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngredientWriteRequest'
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '409':
          description: 이름 중복 (INGREDIENT_NAME_EXISTS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INGREDIENT_NAME_EXISTS
                  message: 이미 등록된 식재료입니다.
                  details: [{ field: name, reason: duplicate }]

  /ingredients/{ingredientId}:
    parameters:
      - $ref: '#/components/parameters/IngredientId'
    get:
      tags: [ingredients]
      summary: 식재료 마스터 상세 (US-008)
      responses:
        '200':
          description: 식재료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [ingredients]
      summary: 식재료 마스터 수정 (US-008)
      description: 로그인 + 소유자. 이름 변경 시 중복이면 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngredientWriteRequest'
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 이름 중복 (INGREDIENT_NAME_EXISTS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INGREDIENT_NAME_EXISTS
                  message: 이미 등록된 식재료입니다.
                  details: [{ field: name, reason: duplicate }]
    delete:
      tags: [ingredients]
      summary: 식재료 마스터 삭제 (US-008)
      description: |
        로그인 + 소유자. 레시피/재고에서 참조 중이면 기본은 409(INGREDIENT_IN_USE)로
        참조 영향을 안내한다(US-008 수용기준). `?force=true` 지정 시 참조를 함께 정리하고 삭제한다.
      parameters:
        - name: force
          in: query
          required: false
          description: true면 참조를 정리하고 강제 삭제
          schema:
            type: boolean
            default: false
            example: false
      responses:
        '204':
          description: 삭제됨 (본문 없음)
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 참조 중이라 삭제 불가 (INGREDIENT_IN_USE). details 로 참조 현황 안내.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INGREDIENT_IN_USE
                  message: 레시피/재고에서 참조 중인 식재료입니다. 강제 삭제하려면 force=true 를 사용하세요.
                  details:
                    - { field: recipes, reason: referenced_by_3 }
                    - { field: inventory, reason: referenced_by_1 }

  # ===========================================================================
  # 재고 — US-011 [Should, 확장] / 부족 재료 대조 US-012 는 RecipeDetail 에 반영
  # ===========================================================================
  /inventory:
    get:
      tags: [inventory]
      summary: 내 재고 목록 (US-011) [Should]
      description: '[확장] 로그인 필요. 보유 식재료(수량·유통기한) 목록.'
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 재고 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryListResponse'
        '401':
          $ref: '#/components/responses/AuthRequired'
    post:
      tags: [inventory]
      summary: 재고 등록 (US-011) [Should]
      description: '[확장] 로그인 필요. 마스터 재료를 선택해 보유 수량·유통기한 저장.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryWriteRequest'
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItem'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthRequired'

  /inventory/{inventoryId}:
    parameters:
      - $ref: '#/components/parameters/InventoryId'
    put:
      tags: [inventory]
      summary: 재고 수정 (US-011) [Should]
      description: '[확장] 로그인 + 소유자. 수량 0 수정/삭제 시 소진 처리는 FE 정책.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryWriteRequest'
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItem'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [inventory]
      summary: 재고 삭제 (US-011) [Should]
      description: '[확장] 로그인 + 소유자. soft delete.'
      responses:
        '204':
          description: 삭제됨 (본문 없음)
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===========================================================================
  # 사진 업로드 — US-004 사진(선택) 지원. G2 확정: 서버가 URL 반환, 레시피는 photo_url 보관
  # ===========================================================================
  /uploads/images:
    post:
      tags: [uploads]
      summary: 이미지 업로드 (US-004 사진 선택)
      description: |
        로그인 필요. multipart/form-data 로 이미지를 업로드하고 저장 URL을 반환한다.
        반환된 `url` 을 레시피의 `photo_url` 에 넣어 저장한다. (소규모 기준, 상세 용량정책은 확장 여지)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 업로드할 이미지 파일 (jpg/png)
      responses:
        '201':
          description: 업로드됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthRequired'

# =============================================================================
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: 로그인/회원가입 시 발급되는 세션 쿠키. HttpOnly.

  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: 페이지네이션 커서 (이전 응답의 next_cursor). 없으면 첫 페이지.
      schema:
        type: string
        example: eyJpZCI6InJjcF8wMUhaWDIifQ
    Limit:
      name: limit
      in: query
      required: false
      description: 페이지 크기 (1~100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        example: 20
    RecipeId:
      name: recipeId
      in: path
      required: true
      schema:
        type: string
        example: rcp_01HZX2KpQ
    IngredientId:
      name: ingredientId
      in: path
      required: true
      schema:
        type: string
        example: ing_01HZX2Kab
    InventoryId:
      name: inventoryId
      in: path
      required: true
      schema:
        type: string
        example: inv_01HZX2Kzz

  responses:
    ValidationError:
      description: 입력 검증 실패 (VALIDATION_ERROR)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: 입력값을 확인해주세요.
              details:
                - { field: title, reason: required }
    AuthRequired:
      description: 로그인 필요 (AUTH_REQUIRED) — FE는 로그인 유도 화면으로 처리 (US-003)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: AUTH_REQUIRED
              message: 로그인이 필요합니다.
              details: []
    Forbidden:
      description: 권한 없음 (FORBIDDEN) — 타인 리소스 접근 (US-006/007)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: FORBIDDEN
              message: 이 리소스에 대한 권한이 없습니다.
              details: []
    NotFound:
      description: 리소스 없음 (RESOURCE_NOT_FOUND)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: RESOURCE_NOT_FOUND
              message: 요청한 리소스를 찾을 수 없습니다.
              details: []

  schemas:
    # ---- 공통 ----
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: SCREAMING_SNAKE_CASE 고정 에러 코드 (FE 분기용)
              example: VALIDATION_ERROR
            message:
              type: string
              example: 입력값을 확인해주세요.
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
      example:
        error:
          code: VALIDATION_ERROR
          message: 입력값을 확인해주세요.
          details:
            - { field: email, reason: invalid_format }

    ErrorDetail:
      type: object
      properties:
        field:
          type: string
          example: email
        reason:
          type: string
          example: invalid_format
      example:
        field: email
        reason: invalid_format

    PageInfo:
      type: object
      description: 커서 페이지네이션 메타 (모든 목록 응답 공통)
      required: [next_cursor, has_more]
      properties:
        next_cursor:
          type: string
          nullable: true
          description: 다음 페이지 커서. 마지막 페이지면 null.
          example: eyJpZCI6InJjcF8wMUhaWDkifQ
        has_more:
          type: boolean
          example: true
      example:
        next_cursor: eyJpZCI6InJjcF8wMUhaWDkifQ
        has_more: true

    # ---- 인증 ----
    User:
      type: object
      required: [id, email, created_at, updated_at]
      properties:
        id:
          type: string
          example: usr_01HZX2Kme
        email:
          type: string
          format: email
          example: cook@navercorp.com
        created_at:
          type: string
          format: date-time
          example: '2026-07-24T09:00:00Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-07-24T09:00:00Z'
      example:
        id: usr_01HZX2Kme
        email: cook@navercorp.com
        created_at: '2026-07-24T09:00:00Z'
        updated_at: '2026-07-24T09:00:00Z'

    SignupRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: cook@navercorp.com
        password:
          type: string
          format: password
          minLength: 8
          description: 최소 8자
          example: s3curePass!
      example:
        email: cook@navercorp.com
        password: s3curePass!

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: cook@navercorp.com
        password:
          type: string
          format: password
          example: s3curePass!
      example:
        email: cook@navercorp.com
        password: s3curePass!

    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'
      example:
        user:
          id: usr_01HZX2Kme
          email: cook@navercorp.com
          created_at: '2026-07-24T09:00:00Z'
          updated_at: '2026-07-24T09:00:00Z'

    # ---- 레시피 ----
    RecipeIngredient:
      type: object
      description: 레시피에 연결된 재료 1건 (US-009). status 는 상세 조회 시 재고 대조 결과(US-012).
      required: [ingredient_id, quantity]
      properties:
        ingredient_id:
          type: string
          example: ing_01HZX2Kab
        name:
          type: string
          description: 표시용 재료명 (응답에서 마스터로부터 채워짐)
          example: 양파
        quantity:
          type: number
          example: 1
        unit:
          type: string
          nullable: true
          example: 개
        status:
          type: string
          description: '[US-012, Should] 재고 대조 결과. 로그인+재고 있을 때만 응답에 포함.'
          enum: [sufficient, insufficient, missing]
          example: sufficient
      example:
        ingredient_id: ing_01HZX2Kab
        name: 양파
        quantity: 1
        unit: 개
        status: sufficient

    RecipeListItem:
      type: object
      description: 목록용 요약 레시피
      required: [id, title, owner_id, created_at, updated_at]
      properties:
        id:
          type: string
          example: rcp_01HZX2KpQ
        title:
          type: string
          example: 김치찌개
        category:
          type: string
          nullable: true
          example: 한식
        photo_url:
          type: string
          nullable: true
          example: https://cdn.example.com/u/rcp_01HZX2KpQ.jpg
        ingredient_count:
          type: integer
          example: 5
        owner_id:
          type: string
          example: usr_01HZX2Kme
        created_at:
          type: string
          format: date-time
          example: '2026-07-24T10:00:00Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-07-24T10:00:00Z'
      example:
        id: rcp_01HZX2KpQ
        title: 김치찌개
        category: 한식
        photo_url: https://cdn.example.com/u/rcp_01HZX2KpQ.jpg
        ingredient_count: 5
        owner_id: usr_01HZX2Kme
        created_at: '2026-07-24T10:00:00Z'
        updated_at: '2026-07-24T10:00:00Z'

    RecipeDetail:
      type: object
      description: 상세 레시피 (US-005). is_owner 로 수정/삭제 UI 노출 판단.
      required: [id, title, steps, ingredients, owner_id, created_at, updated_at]
      properties:
        id:
          type: string
          example: rcp_01HZX2KpQ
        title:
          type: string
          example: 김치찌개
        category:
          type: string
          nullable: true
          example: 한식
        description:
          type: string
          nullable: true
          description: 한 줄 설명 (선택)
          example: 묵은지로 끓이는 얼큰한 김치찌개
        photo_url:
          type: string
          nullable: true
          example: https://cdn.example.com/u/rcp_01HZX2KpQ.jpg
        steps:
          type: array
          description: 조리 단계 (순서대로)
          items:
            type: string
          example:
            - 냄비에 김치와 물을 넣고 끓인다.
            - 돼지고기를 넣고 20분 더 끓인다.
            - 두부와 대파를 넣고 마무리한다.
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/RecipeIngredient'
        ingredient_availability:
          $ref: '#/components/schemas/IngredientAvailability'
        owner_id:
          type: string
          example: usr_01HZX2Kme
        is_owner:
          type: boolean
          description: 현재 요청자가 소유자인지 (비로그인은 false)
          example: true
        created_at:
          type: string
          format: date-time
          example: '2026-07-24T10:00:00Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-07-24T10:00:00Z'
      example:
        id: rcp_01HZX2KpQ
        title: 김치찌개
        category: 한식
        description: 묵은지로 끓이는 얼큰한 김치찌개
        photo_url: https://cdn.example.com/u/rcp_01HZX2KpQ.jpg
        steps:
          - 냄비에 김치와 물을 넣고 끓인다.
          - 돼지고기를 넣고 20분 더 끓인다.
          - 두부와 대파를 넣고 마무리한다.
        ingredients:
          - { ingredient_id: ing_01HZX2Kab, name: 김치, quantity: 300, unit: g, status: sufficient }
          - { ingredient_id: ing_01HZX9Q77, name: 돼지고기, quantity: 200, unit: g, status: missing }
        ingredient_availability:
          status: insufficient
          missing_count: 1
          missing_ingredients:
            - { ingredient_id: ing_01HZX9Q77, name: 돼지고기, required_quantity: 200, unit: g }
        owner_id: usr_01HZX2Kme
        is_owner: true
        created_at: '2026-07-24T10:00:00Z'
        updated_at: '2026-07-24T10:00:00Z'

    RecipeWriteRequest:
      type: object
      description: 레시피 생성/수정 공통 본문 (US-004, US-006, 재료 연결 US-009)
      required: [title, steps, ingredients]
      properties:
        title:
          type: string
          minLength: 1
          example: 김치찌개
        category:
          type: string
          nullable: true
          example: 한식
        description:
          type: string
          nullable: true
          example: 묵은지로 끓이는 얼큰한 김치찌개
        photo_url:
          type: string
          nullable: true
          description: /uploads/images 로 업로드해 받은 URL (선택)
          example: https://cdn.example.com/u/rcp_01HZX2KpQ.jpg
        steps:
          type: array
          items:
            type: string
          example:
            - 냄비에 김치와 물을 넣고 끓인다.
            - 돼지고기를 넣고 20분 더 끓인다.
        ingredients:
          type: array
          description: 마스터 ingredient_id 로 연결. 빈 배열 허용.
          items:
            type: object
            required: [ingredient_id, quantity]
            properties:
              ingredient_id:
                type: string
                example: ing_01HZX2Kab
              quantity:
                type: number
                example: 300
              unit:
                type: string
                nullable: true
                example: g
      example:
        title: 김치찌개
        category: 한식
        description: 묵은지로 끓이는 얼큰한 김치찌개
        photo_url: https://cdn.example.com/u/rcp_01HZX2KpQ.jpg
        steps:
          - 냄비에 김치와 물을 넣고 끓인다.
          - 돼지고기를 넣고 20분 더 끓인다.
        ingredients:
          - { ingredient_id: ing_01HZX2Kab, quantity: 300, unit: g }
          - { ingredient_id: ing_01HZX9Q77, quantity: 200, unit: g }

    RecipeListResponse:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RecipeListItem'
        next_cursor:
          type: string
          nullable: true
          example: eyJpZCI6InJjcF8wMUhaWDkifQ
        has_more:
          type: boolean
          example: true
      example:
        data:
          - id: rcp_01HZX2KpQ
            title: 김치찌개
            category: 한식
            photo_url: https://cdn.example.com/u/rcp_01HZX2KpQ.jpg
            ingredient_count: 5
            owner_id: usr_01HZX2Kme
            created_at: '2026-07-24T10:00:00Z'
            updated_at: '2026-07-24T10:00:00Z'
        next_cursor: eyJpZCI6InJjcF8wMUhaWDkifQ
        has_more: true

    # ---- 식재료 마스터 ----
    Ingredient:
      type: object
      description: 회원 개인별 식재료 마스터 항목 (US-008)
      required: [id, name, owner_id, created_at, updated_at]
      properties:
        id:
          type: string
          example: ing_01HZX2Kab
        name:
          type: string
          example: 양파
        category:
          type: string
          nullable: true
          example: 채소
        default_unit:
          type: string
          nullable: true
          description: 기본 단위
          example: 개
        owner_id:
          type: string
          example: usr_01HZX2Kme
        created_at:
          type: string
          format: date-time
          example: '2026-07-24T09:30:00Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-07-24T09:30:00Z'
      example:
        id: ing_01HZX2Kab
        name: 양파
        category: 채소
        default_unit: 개
        owner_id: usr_01HZX2Kme
        created_at: '2026-07-24T09:30:00Z'
        updated_at: '2026-07-24T09:30:00Z'

    IngredientWriteRequest:
      type: object
      description: 식재료 마스터 생성/수정 공통 본문 (US-008)
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          example: 양파
        category:
          type: string
          nullable: true
          example: 채소
        default_unit:
          type: string
          nullable: true
          example: 개
      example:
        name: 양파
        category: 채소
        default_unit: 개

    IngredientListResponse:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Ingredient'
        next_cursor:
          type: string
          nullable: true
          example: null
        has_more:
          type: boolean
          example: false
      example:
        data:
          - id: ing_01HZX2Kab
            name: 양파
            category: 채소
            default_unit: 개
            owner_id: usr_01HZX2Kme
            created_at: '2026-07-24T09:30:00Z'
            updated_at: '2026-07-24T09:30:00Z'
        next_cursor: null
        has_more: false

    # ---- 재고 (US-011 Should) & 대조 (US-012 Should) ----
    InventoryItem:
      type: object
      description: '[Should/US-011] 보유 재고 1건'
      required: [id, ingredient_id, quantity, owner_id, created_at, updated_at]
      properties:
        id:
          type: string
          example: inv_01HZX2Kzz
        ingredient_id:
          type: string
          example: ing_01HZX2Kab
        ingredient_name:
          type: string
          example: 양파
        quantity:
          type: number
          example: 3
        unit:
          type: string
          nullable: true
          example: 개
        expires_at:
          type: string
          format: date
          nullable: true
          description: 유통기한 (선택)
          example: '2026-08-10'
        owner_id:
          type: string
          example: usr_01HZX2Kme
        created_at:
          type: string
          format: date-time
          example: '2026-07-24T11:00:00Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-07-24T11:00:00Z'
      example:
        id: inv_01HZX2Kzz
        ingredient_id: ing_01HZX2Kab
        ingredient_name: 양파
        quantity: 3
        unit: 개
        expires_at: '2026-08-10'
        owner_id: usr_01HZX2Kme
        created_at: '2026-07-24T11:00:00Z'
        updated_at: '2026-07-24T11:00:00Z'

    InventoryWriteRequest:
      type: object
      description: '[Should/US-011] 재고 생성/수정 본문'
      required: [ingredient_id, quantity]
      properties:
        ingredient_id:
          type: string
          example: ing_01HZX2Kab
        quantity:
          type: number
          minimum: 0
          example: 3
        unit:
          type: string
          nullable: true
          example: 개
        expires_at:
          type: string
          format: date
          nullable: true
          example: '2026-08-10'
      example:
        ingredient_id: ing_01HZX2Kab
        quantity: 3
        unit: 개
        expires_at: '2026-08-10'

    InventoryListResponse:
      type: object
      required: [data, next_cursor, has_more]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/InventoryItem'
        next_cursor:
          type: string
          nullable: true
          example: null
        has_more:
          type: boolean
          example: false
      example:
        data:
          - id: inv_01HZX2Kzz
            ingredient_id: ing_01HZX2Kab
            ingredient_name: 양파
            quantity: 3
            unit: 개
            expires_at: '2026-08-10'
            owner_id: usr_01HZX2Kme
            created_at: '2026-07-24T11:00:00Z'
            updated_at: '2026-07-24T11:00:00Z'
        next_cursor: null
        has_more: false

    IngredientAvailability:
      type: object
      description: |
        [Should/US-012] 레시피 상세에서 내 재고 대비 재료 충족 여부.
        비로그인 또는 재고 없음 시 RecipeDetail 에서 생략된다.
        단위 환산 미지원(PRD Open Question) — 동일 단위 기준으로 판정.
      required: [status, missing_count]
      properties:
        status:
          type: string
          enum: [sufficient, insufficient]
          description: sufficient=재료 충족, insufficient=부족 재료 있음
          example: insufficient
        missing_count:
          type: integer
          example: 1
        missing_ingredients:
          type: array
          items:
            type: object
            properties:
              ingredient_id:
                type: string
                example: ing_01HZX9Q77
              name:
                type: string
                example: 돼지고기
              required_quantity:
                type: number
                example: 200
              unit:
                type: string
                nullable: true
                example: g
      example:
        status: insufficient
        missing_count: 1
        missing_ingredients:
          - { ingredient_id: ing_01HZX9Q77, name: 돼지고기, required_quantity: 200, unit: g }

    # ---- 업로드 ----
    UploadResponse:
      type: object
      required: [url]
      properties:
        url:
          type: string
          example: https://cdn.example.com/u/rcp_01HZX2KpQ.jpg
      example:
        url: https://cdn.example.com/u/rcp_01HZX2KpQ.jpg
